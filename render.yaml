services:
  - type: web
    name: physrum-fleet-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
